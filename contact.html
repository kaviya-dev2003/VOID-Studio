<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | VOID Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .contact-container {
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }

        .contact-header {
            margin-bottom: 5rem;
        }

        .contact-header h2 {
            font-size: var(--h2-size);
            font-weight: 300;
            margin-bottom: 2rem;
            color: var(--accent-gold);
        }

        .contact-header p {
            font-size: 1.25rem;
            color: var(--text-grey);
            letter-spacing: 2px;
        }

        .contact-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            text-align: left;
        }

        .full-width {
            grid-column: span 2;
        }

        .submit-container {
            margin-top: 3rem;
            display: flex;
            justify-content: center;
        }

        .btn-gold:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(199, 167, 108, 0.2);
        }

        @media (max-width: 768px) {
            .contact-form {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">VOID</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="works.html">Works</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section class="contact flex-center">
            <div class="contact-container">
                <div class="contact-header">
                    <h2>Let's talk.</h2>
                    <p>If you value clarity over noise, we should talk.</p>
                </div>

                <form class="contact-form">
                    <div>
                        <input type="text" placeholder="YOUR NAME" required>
                    </div>
                    <div>
                        <input type="email" placeholder="YOUR EMAIL" required>
                    </div>
                    <div class="full-width">
                        <textarea placeholder="PROJECT BRIEF" rows="5"></textarea>
                    </div>
                </form>

                <div class="submit-container">
                    <button type="submit" class="btn-gold">Start a Project</button>
                </div>
            </div>
        </section>
    </main>

    <footer
        style="padding: 2rem 5%; text-align: center; color: var(--text-grey); font-size: 0.8rem; letter-spacing: 2px;">
        &copy; 2026 VOID STUDIO. ALL RIGHTS RESERVED.
    </footer>
</body>

</html>
