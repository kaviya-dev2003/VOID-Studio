<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Works | VOID Studio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .works-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            grid-auto-rows: 400px;
            grid-gap: 2rem;
            grid-auto-flow: dense;
        }

        .work-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
        }

        .work-item.large {
            grid-row: span 2;
            grid-column: span 2;
        }

        .work-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            transition: var(--transition-smooth);
        }

        .work-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 15, 15, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: var(--transition-smooth);
            padding: 2rem;
            text-align: center;
        }

        .work-item:hover img {
            filter: grayscale(0%);
            transform: scale(1.05);
        }

        .work-item:hover .work-overlay {
            opacity: 1;
        }

        .work-overlay h3 {
            font-size: 1.5rem;
            text-transform: uppercase;
            letter-spacing: 5px;
            color: var(--accent-gold);
            margin-bottom: 0.5rem;
        }

        .work-overlay p {
            font-size: 0.8rem;
            letter-spacing: 2px;
            color: var(--text-grey);
        }

        @media (max-width: 768px) {
            .work-item.large {
                grid-row: span 1;
                grid-column: span 1;
            }

            .works-grid {
                grid-auto-rows: 300px;
            }
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">VOID</div>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="works.html" class="active">Works</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <main>
        <section class="works">
            <h2
                style="font-size: var(--h2-size); font-weight: 300; margin-bottom: 4rem; text-align: center; letter-spacing: 10px;">
                SELECTED WORKS</h2>
            <div class="works-grid">
                <div class="work-item large">
                    <img src="work1.png" alt="Brand Identity">
                    <div class="work-overlay">
                        <h3>Brand Identity</h3>
                        <p>Visual Strategy & Logo Design</p>
                    </div>
                </div>
                <div class="work-item">
                    <img src="work2.png" alt="UI Concept">
                    <div class="work-overlay">
                        <h3>UI Concept</h3>
                        <p>Digital Experience Design</p>
                    </div>
                </div>
                <div class="work-item">
                    <img src="work3.png" alt="Architecture">
                    <div class="work-overlay">
                        <h3>Landing Page</h3>
                        <p>Web Architecture</p>
                    </div>
                </div>
                <!-- Additional placeholder for grid variety -->
                <div class="work-item">
                    <img src="work1.png" alt="UI Design" style="filter: grayscale(100%) brightness(0.5);">
                    <div class="work-overlay">
                        <h3>Mobile App</h3>
                        <p>Interface Innovation</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer
        style="padding: 2rem 5%; text-align: center; color: var(--text-grey); font-size: 0.8rem; letter-spacing: 2px;">
        &copy; 2026 VOID STUDIO. ALL RIGHTS RESERVED.
    </footer>
</body>

</html>
